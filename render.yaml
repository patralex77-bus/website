services:
  - type: web
    name: austria-express
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_CONTENT_LENGTH_MB
        value: "10"
      - key: PUBLIC_BASE_URL
        sync: false

      # Email notifications
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: NOTIFICATION_TO
        value: office@austria-express.eu
      - key: MAIL_FROM
        value: office@austria-express.eu
      - key: MAIL_FROM_NAME
        value: Austria Express Website
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
