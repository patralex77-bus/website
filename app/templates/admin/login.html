<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}"></head><body class="min-h-screen bg-slate-950 text-white"><main class="flex min-h-screen items-center justify-center px-4"><form method="post" class="w-full max-w-md rounded-[2rem] bg-white p-8 text-slate-900 shadow-xl"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><h1 class="text-3xl font-black">Admin Login</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="mt-5">{% for category, message in messages %}<div class="mb-3 rounded-2xl px-4 py-3 font-bold {% if category == 'error' %}bg-red-50 text-red-800{% else %}bg-green-50 text-green-800{% endif %}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}<label class="mt-6 block text-sm font-bold">Benutzername<input name="username" class="field mt-2" required autofocus></label><label class="mt-4 block text-sm font-bold">Passwort<input name="password" type="password" class="field mt-2" required></label><button class="mt-6 w-full rounded-2xl bg-red-700 px-6 py-4 font-black text-white hover:bg-red-800">Einloggen</button></form></main></body></html>
