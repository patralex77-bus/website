{% extends "admin/base_admin.html" %}{% block content %}<div class="mb-8 flex justify-between items-end"><div><h1 class="text-4xl font-black">Beiträge</h1></div><a href="{{ url_for('admin.post_new') }}" class="rounded-2xl bg-red-700 px-6 py-4 font-black text-white">Neuer Beitrag</a></div><div class="grid gap-5">{% for post in posts %}<div class="rounded-[2rem] bg-white p-6 shadow-sm"><div class="flex justify-between gap-4"><div><h2 class="text-2xl font-black">{{ post.title }}</h2><div class="text-sm text-slate-500">{{ post.category }} · {{ post.status }}</div></div><div class="flex gap-2"><a href="{{ url_for('admin.post_edit', post_id=post.id) }}" class="rounded-xl bg-slate-900 px-4 py-2 font-bold text-white">Edit</a><form method="post" action="{{ url_for('admin.post_delete', post_id=post.id) }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="rounded-xl bg-red-50 px-4 py-2 font-bold text-red-700">Delete</button></form></div></div></div>{% else %}<div class="rounded-[2rem] bg-white p-8">Keine Beiträge.</div>{% endfor %}</div>{% endblock %}
