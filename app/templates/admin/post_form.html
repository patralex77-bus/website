{% extends "admin/base_admin.html" %}{% block content %}<a href="{{ url_for('admin.posts_list') }}" class="font-bold text-red-700">← Zurück</a><h1 class="mt-3 mb-8 text-4xl font-black">{% if post %}Beitrag bearbeiten{% else %}Neuer Beitrag{% endif %}</h1><form method="post" enctype="multipart/form-data" class="rounded-[2rem] bg-white p-8 shadow-sm"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="grid gap-6 lg:grid-cols-2"><div class="grid gap-5"><label class="text-sm font-bold">Titel<input name="title" value="{{ post.title if post else '' }}" class="field mt-2" required></label><label class="text-sm font-bold">Slug<input name="slug" value="{{ post.slug if post else '' }}" class="field mt-2"></label><label class="text-sm font-bold">Excerpt<textarea name="excerpt" class="field mt-2 min-h-[100px]">{{ post.excerpt if post and post.excerpt else '' }}</textarea></label><label class="text-sm font-bold">Text<textarea name="body" class="field mt-2 min-h-[320px]" required>{{ post.body if post else '' }}</textarea></label></div><div class="grid content-start gap-5"><label class="text-sm font-bold">Kategorie<input name="category" value="{{ post.category if post else 'Allgemein' }}" class="field mt-2"></label><label class="text-sm font-bold">Status<select name="status" class="field mt-2">{% for status in ['draft','published','archived'] %}<option value="{{ status }}" {% if post and post.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label class="text-sm font-bold">Sortierung<input name="sort_order" type="number" value="{{ post.sort_order if post else 100 }}" class="field mt-2"></label><label class="text-sm font-bold">Bild<input name="main_image" type="file" accept="image/*" class="field mt-2"></label>{% if post and post.main_image %}<img src="{{ url_for('static', filename=post.main_image) }}" class="rounded-3xl">{% endif %}<label class="text-sm font-bold">Alt Text<input name="alt_text" value="{{ post.alt_text if post and post.alt_text else '' }}" class="field mt-2"></label><label class="text-sm font-bold">SEO Title<input name="seo_title" value="{{ post.seo_title if post and post.seo_title else '' }}" class="field mt-2"></label><label class="text-sm font-bold">SEO Description<textarea name="seo_description" class="field mt-2">{{ post.seo_description if post and post.seo_description else '' }}</textarea></label></div></div><button class="mt-8 rounded-2xl bg-red-700 px-6 py-4 font-black text-white">Speichern</button></form>{% endblock %}
