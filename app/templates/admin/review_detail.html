{% extends "admin/base_admin.html" %}{% block content %}<a href="{{ url_for('admin.reviews_list') }}" class="font-bold text-red-700">← Zurück</a><h1 class="mt-3 mb-8 text-4xl font-black">Bewertung bearbeiten</h1><form method="post" class="rounded-[2rem] bg-white p-8 shadow-sm"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="grid gap-5"><div class="rounded-3xl bg-slate-50 p-5"><strong>Intern:</strong> {{ review.customer_name }} · {{ review.email_internal }} · {{ review.phone_internal or '-' }}</div><input name="public_display_name" class="field" value="{{ review.public_display_name or review.organisation or review.customer_name }}"><input name="trip_type" class="field" value="{{ review.trip_type }}"><select name="rating" class="field">{% for rating in [5,4,3,2,1] %}<option value="{{ rating }}" {% if review.rating == rating %}selected{% endif %}>{{ rating }} Sterne</option>{% endfor %}</select><textarea name="text" class="field min-h-[260px]">{{ review.text }}</textarea><div class="flex flex-wrap gap-3"><button name="action" value="approved" class="rounded-2xl bg-green-700 px-6 py-4 font-black text-white">Freigeben</button><button name="action" value="pending" class="rounded-2xl bg-slate-900 px-6 py-4 font-black text-white">Pending</button><button name="action" value="rejected" class="rounded-2xl bg-amber-600 px-6 py-4 font-black text-white">Ablehnen</button><button name="action" value="archived" class="rounded-2xl bg-slate-500 px-6 py-4 font-black text-white">Archivieren</button></div></div></form>{% endblock %}
