{% extends "admin/base_admin.html" %}{% block content %}<h1 class="mb-8 text-4xl font-black">Medien</h1><form method="post" enctype="multipart/form-data" class="mb-8 rounded-[2rem] bg-white p-8 shadow-sm"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="grid gap-5 lg:grid-cols-[1fr_1fr_auto] lg:items-end"><label class="font-bold">Datei<input type="file" name="file" accept="image/*" class="field mt-2"></label><label class="font-bold">Alt Text<input name="alt_text" class="field mt-2"></label><button class="rounded-2xl bg-red-700 px-6 py-4 font-black text-white">Hochladen</button></div></form><div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">{% for media in media_files %}<article class="rounded-[2rem] bg-white p-4 shadow-sm"><img src="{{ url_for('static', filename=media.file_path) }}" class="h-44 w-full rounded-3xl object-cover"><div class="mt-3 text-sm font-bold break-all">{{ media.original_name }}</div><div class="mt-1 text-xs text-slate-500 break-all">{{ media.file_path }}</div></article>{% else %}<div class="rounded-[2rem] bg-white p-8">Noch keine Medien.</div>{% endfor %}</div>{% endblock %}
