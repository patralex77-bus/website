{% extends "admin/base_admin.html" %}{% block content %}<a href="{{ url_for('admin.school_destinations_list') }}" class="font-bold text-red-700">← Zurück</a><h1 class="mt-3 mb-8 text-4xl font-black">{% if item %}Destination bearbeiten{% else %}Neue Destination{% endif %}</h1><form method="post" enctype="multipart/form-data" class="rounded-[2rem] bg-white p-8 shadow-sm"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="grid gap-6 lg:grid-cols-2"><div class="grid gap-5"><label class="text-sm font-bold">Titel<input class="field mt-2" name="title" value="{{ item.title if item else '' }}" required></label><label class="text-sm font-bold">Slug<input class="field mt-2" name="slug" value="{{ item.slug if item else '' }}"></label><label class="text-sm font-bold">Zone<input class="field mt-2" name="zone" value="{{ item.zone if item else 'A' }}"></label><label class="text-sm font-bold">Kategorie<input class="field mt-2" name="category" value="{{ item.category if item else 'Allgemein' }}"></label><label class="text-sm font-bold">Tags<input class="field mt-2" name="tags" value="{{ item.tags if item and item.tags else '' }}"></label><label class="text-sm font-bold">Kurzbeschreibung<textarea class="field mt-2 min-h-[100px]" name="short_description" required>{{ item.short_description if item else '' }}</textarea></label><label class="text-sm font-bold">Beschreibung<textarea class="field mt-2 min-h-[220px]" name="full_description">{{ item.full_description if item and item.full_description else '' }}</textarea></label></div><div class="grid content-start gap-5"><label class="text-sm font-bold">Alter<input class="field mt-2" name="age_group" value="{{ item.age_group if item and item.age_group else '' }}"></label><label class="text-sm font-bold">Distanz km<input class="field mt-2" name="distance_km" value="{{ item.distance_km if item and item.distance_km else '' }}"></label><label class="text-sm font-bold">Fahrtzeit<input class="field mt-2" name="travel_time" value="{{ item.travel_time if item and item.travel_time else '' }}"></label><div class="grid gap-5 sm:grid-cols-2"><label class="text-sm font-bold">Preis 53<input class="field mt-2" name="price_53" value="{{ item.price_53 if item and item.price_53 else '' }}"></label><label class="text-sm font-bold">Preis 75<input class="field mt-2" name="price_75" value="{{ item.price_75 if item and item.price_75 else '' }}"></label></div><div class="grid gap-5 sm:grid-cols-2"><label class="text-sm font-bold">Latitude<input class="field mt-2" name="latitude" value="{{ item.latitude if item and item.latitude else '' }}"></label><label class="text-sm font-bold">Longitude<input class="field mt-2" name="longitude" value="{{ item.longitude if item and item.longitude else '' }}"></label></div><label class="text-sm font-bold">Bild<input class="field mt-2" type="file" name="main_image" accept="image/*"></label>{% if item and item.main_image %}<img src="{{ url_for('static', filename=item.main_image) }}" class="rounded-3xl">{% endif %}<label class="text-sm font-bold">Alt Text<input class="field mt-2" name="alt_text" value="{{ item.alt_text if item and item.alt_text else '' }}"></label><label class="text-sm font-bold">Sortierung<input class="field mt-2" type="number" name="sort_order" value="{{ item.sort_order if item else 100 }}"></label><label class="flex gap-3 font-bold"><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Aktiv</label></div></div><button class="mt-8 rounded-2xl bg-red-700 px-6 py-4 font-black text-white">Speichern</button></form>{% endblock %}
