{% extends "admin/base_admin.html" %}{% block content %}<div class="mb-8 flex justify-between items-end"><h1 class="text-4xl font-black">Fuhrpark</h1><a href="{{ url_for('admin.fleet_new') }}" class="rounded-2xl bg-red-700 px-6 py-4 font-black text-white">Neues Fahrzeug</a></div><div class="grid gap-5">{% for item in items %}<div class="rounded-[2rem] bg-white p-6 shadow-sm"><div class="flex justify-between gap-4"><div><h2 class="text-2xl font-black">{{ item.name }}</h2><div class="text-sm text-slate-500">{{ item.category }} · {{ item.seats }} Sitze · {{ item.quantity }} Fahrzeug(e)</div><p class="mt-2 text-slate-600">{{ item.description }}</p></div><div class="flex gap-2"><a href="{{ url_for('admin.fleet_edit', item_id=item.id) }}" class="rounded-xl bg-slate-900 px-4 py-2 font-bold text-white">Edit</a><form method="post" action="{{ url_for('admin.fleet_delete', item_id=item.id) }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="rounded-xl bg-red-50 px-4 py-2 font-bold text-red-700">Delete</button></form></div></div></div>{% else %}<div class="rounded-[2rem] bg-white p-8">Keine Fahrzeuge.</div>{% endfor %}</div>{% endblock %}
