  <style>
    /* Austria Express responsive fit
       Instead of forcing browser zoom to 90%, the public pages use a compact
       desktop scale on smaller monitors. Tailwind spacing and typography are
       rem-based, so this reduces visual size without breaking mobile layout. */
    @media (min-width: 1024px) and (max-width: 1536px) {
      html { font-size: 14.4px; }
    }
    @media (min-width: 1537px) {
      html { font-size: 15.5px; }
    }
    @media (max-width: 640px) {
      html { font-size: 15px; }
    }
